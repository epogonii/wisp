# The zip is built the way a release builds it and read by shexli, the same
# checks extensions.gnome.org runs on an upload. Findings already looked at and
# accepted are in shexli-baseline.json; only a new one fails the job.
name: shexli

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  shexli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install glib-compile-schemas and msgfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext

      - name: Build the zip
        run: tools/pack.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # shexli asks for tree-sitter 0.25 or later and aborts on 0.26.0 before
      # it writes a report. extensions.gnome.org runs 0.25.2, pinned in
      # extensions-web's requirements.txt; installed here first, it is what
      # the action finds already there and keeps.
      - name: Install the tree-sitter extensions.gnome.org runs
        run: python3 -m pip install --user 'tree-sitter==0.25.2' 'tree-sitter-javascript==0.25.0'

      - uses: 3v1n0/shexli-ci@c31b5dc22ae7acd684e5ec9ee6728f39ac2e1eac
        with:
          path: wisp.zip
          baseline: shexli-baseline.json
          shexli-source: git+https://gitlab.gnome.org/3v1n0/extensions-web.git@6ab2f2be0d70fbb6b5661dd91bed37db0f3c7765#subdirectory=shexli
